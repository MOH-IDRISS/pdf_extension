
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>File to PDF</title>
    <link rel="stylesheet" href="index.css">
</head>
<body>

    <div class="container">

        <h1>File to PDF</h1>
        <p class="subtitle">Convert your files locally</p>

        <label class="upload-area" for="fileInput">
            <span class="upload-icon">📁</span>
            <strong>Select your file</strong>
            <span>JPG, PNG, WEBP, TXT, DOCX, XLSX, PPTX, HTML</span>
        </label>

        <input
            type="file"
            id="fileInput"
            accept=".jpg,.jpeg,.png,.webp,.txt,.docx,.xlsx,.pptx,.html,.htm"
        >

        <div id="fileInfo" class="file-info">
            No file selected
        </div>

        <button id="convertBtn" disabled>
            Convert to PDF
        </button>

        <p id="status">Ready</p>

    </div>

    <script src="dist/index.js"></script>

</body>
</html>
